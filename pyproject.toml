[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "toolsmith-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch", "transformers>=4.45", "datasets>=3", "peft>=0.13", "trl>=0.12"]
[project.scripts]
toolsmith = "toolsmith.core:main"
[tool.setuptools.packages.find]
where = ["src"]
